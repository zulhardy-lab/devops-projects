apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  labels:
    app: hpa-demo
spec:
  # No "replicas" here on purpose: the HorizontalPodAutoscaler decides how many pods run.
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      # Read-only account for the dashboard: its own namespace's pods, autoscaler and pod CPU, nothing else.
      # On the homelab it comes from onboarding; on your own cluster scripts/hpa-demo.sh creates it (rbac-app-reader.yaml).
      serviceAccountName: app-reader
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # scripts/deploy.sh replaces APP_IMAGE with the exact image built for this commit.
          image: APP_IMAGE
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m # the autoscaler's % target is measured against this
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
