# Read-only account for the dashboard (pods, autoscaler and pod CPU in this namespace only; no Secrets, no writes).
# NOT applied by the pipeline (no NN- prefix): on the homelab, onboarding creates the same account
# (zulhardy-lab/homelab, ansible/files/k8s/app-deployer-rbac.yaml.tmpl). On your own cluster,
# "scripts/hpa-demo.sh deploy" applies it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-reader
subjects:
  - kind: ServiceAccount
    name: app-reader
