# Not deployed by the pipeline (not numbered). Started and stopped by: scripts/hpa-demo.sh load-start | load-stop
# Sends requests to the Service in a loop to push CPU up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          # busybox:1.37 pinned by digest (read on docker01 on 2026-11-26)
          image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -O- http://hpa-demo/ >/dev/null 2>&1; done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
